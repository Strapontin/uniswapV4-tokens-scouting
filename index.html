<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pool Initialize Logs</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #111827;
        --panel: #1f2937;
        --panel-alt: #0f172a;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --border: rgba(255, 255, 255, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
      }

      h1 {
        margin-bottom: 24px;
      }

      .status {
        margin-bottom: 20px;
        color: var(--muted);
      }

      .logs {
        display: grid;
        gap: 16px;
      }

      .log-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }

      .log-card h2 {
        margin: 0 0 12px 0;
        font-size: 1.1rem;
      }

      .meta {
        display: grid;
        gap: 8px;
        font-size: 0.95rem;
      }

      .meta strong {
        color: var(--accent);
      }

      .topics {
        margin-top: 14px;
        display: grid;
        gap: 8px;
      }

      .topic {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--panel-alt);
      }

      .topic-label {
        color: var(--muted);
      }

      .error {
        color: #fca5a5;
      }

      code {
        word-break: break-all;
        font-family: "SFMono-Regular", Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <h1>Pool Initialize Logs</h1>
    <div id="status" class="status">Loading...</div>
    <div id="logs" class="logs"></div>

    <script>
      const topicLabels = {
        1: 'id',
        2: 'currency0',
        3: 'currency1',
        4: 'fee',
        5: 'tickSpacing',
        6: 'hooks',
        7: 'sqrtPriceX96',
        8: 'tick',
      };

      async function loadLogs() {
        try {
          const response = await fetch('./logs.json');
          if (!response.ok) {
            throw new Error(`Failed to load logs.json: ${response.status}`);
          }

          const data = await response.json();
          const logs = data.result || [];
          const statusEl = document.getElementById('status');
          const logsEl = document.getElementById('logs');

          statusEl.textContent = `Status: ${data.status} • Result count: ${logs.length}`;

          if (!logs.length) {
            logsEl.innerHTML = '<div class="log-card"><h2>No logs found</h2></div>';
            return;
          }

          logsEl.innerHTML = logs
            .map((log, index) => {
              const topics = Array.isArray(log.topics) ? log.topics : [];

              const topicsHtml = topics
                .map((topic, idx) => {
                  const label = topicLabels[idx + 1] || `topic${idx + 1}`;
                  return `
                    <div class="topic">
                      <div class="topic-label">${label}</div>
                      <code>${topic}</code>
                    </div>
                  `;
                })
                .join('');

              return `
                <div class="log-card">
                  <h2>Log #${index + 1}</h2>
                  <div class="meta">
                    <div><strong>blockNumber:</strong> ${log.blockNumber || 'n/a'}</div>
                    <div><strong>txHash:</strong> <code>${log.transactionHash || 'n/a'}</code></div>
                    <div><strong>address:</strong> <code>${log.address || 'n/a'}</code></div>
                  </div>
                  <div class="topics">
                    ${topicsHtml}
                  </div>
                </div>
              `;
            })
            .join('');
        } catch (error) {
          document.getElementById('status').innerHTML = `<span class="error">${error.message}</span>`;
        }
      }

      loadLogs();
    </script>
  </body>
</html>
